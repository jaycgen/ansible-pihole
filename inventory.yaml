all:
  hosts:
    rpi:
      ansible_host: 192.168.1.4
      priority: 101
    # pihole-2:
    #   ansible_host: 192.168.1.44
    #   priority: 100
  vars:
    ansible_user: pi
    ansible_python_interpreter: /usr/bin/python3
    timezone: "Europe/London"
    static_dns: "1.1.1.1"
    pihole_image: "pihole/pihole:2026.09.0"
    ftlconf_dns_upstreams: "1.1.1.1;2606:4700:4700::1111"
    ftlconf_dns_listeningMode: "local"
    ftlconf_dns_revservers: "true,192.168.1.0/24,192.168.1.1,internal"
    ftlconf_webserver_port: "80,443s"
    ftlconf_webserver_domain: "rpi.internal"
    ftlconf_webserver_tls_cert: "/etc/pihole/tls.pem"
    pki_mount_point: "{{ lookup('env', 'PKI_MOUNT_POINT') | default('/Volumes/InternalPKI', true) }}"
    pihole_ha_mode: no
    pihole_vip_ipv4: "192.168.1.10/24"
    pihole_vip_ipv6: "fd00::10/64"
    sync_target: "{{ pihole_vip_ipv4.split('/')[0] }}"
