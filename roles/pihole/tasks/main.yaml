- name: Create pihole directory
  file:
    path: "/home/{{ ansible_user }}/pihole"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    state: directory
    mode: 0755

- name: Create backups directory
  file:
    path: "/home/{{ ansible_user }}/backups"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    state: directory
    mode: 0700

- name: Create pre-upgrade safety backup archive
  archive:
    path:
      - "/home/{{ ansible_user }}/pihole"
      - "/home/{{ ansible_user }}/proxy"
    dest: "/home/{{ ansible_user }}/backups/pihole-pre-v6-backup.tar.gz"
    mode: '0600'

- name: Ensure target pihole config directory exists
  file:
    path: "/home/{{ ansible_user }}/pihole/pihole"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    state: directory
    mode: 0755

- name: Deploy combined PKI TLS certificate to pihole
  copy:
    src: "{{ pki_mount_point }}/issued/rpi.internal/rpi.internal.tls.pem"
    dest: "/home/{{ ansible_user }}/pihole/pihole/tls.pem"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: 0600

- name: Stop and remove legacy proxy container
  docker_container:
    name: proxy
    state: absent

- name: Remove legacy rpi-proxy docker network
  docker_network:
    name: rpi-proxy
    state: absent

- name: Start/Update pihole container
  docker_container:
    name: pihole
    image: "{{ pihole_image }}"
    pull: yes
    restart_policy: unless-stopped
    env:
      TZ: "{{ timezone }}"
      FTLCONF_webserver_api_password: "{{ pihole_webpassword }}"
      FTLCONF_dns_upstreams: "{{ ftlconf_dns_upstreams }}"
      FTLCONF_dns_listeningMode: "{{ ftlconf_dns_listeningMode }}"
      FTLCONF_dns_revServers: "{{ ftlconf_dns_revservers }}"
      FTLCONF_webserver_port: "{{ ftlconf_webserver_port }}"
      FTLCONF_webserver_domain: "{{ ftlconf_webserver_domain }}"
      FTLCONF_webserver_tls_cert: "{{ ftlconf_webserver_tls_cert }}"
    dns_servers:
      - 127.0.0.1
      - "{{ static_dns }}"
    network_mode: host
    volumes:
      - "/home/{{ ansible_user }}/pihole/pihole/:/etc/pihole/"
    log_driver: json-file
    log_options:
      max-size: "10m"
      max-file: "5"
    capabilities:
      - CAP_NET_BIND_SERVICE
      - CAP_SYS_NICE
      - CAP_CHOWN

- name: Check pihole container via HTTPS
  uri:
    url: https://localhost/admin/
    validate_certs: no
    status_code:
      - 200
      - 302
  register: result
  until: result.status in [200, 302]
  retries: 5
  delay: 10

- name: Remove old image versions
  docker_prune:
    images: yes
    images_filters:
      dangling: false
